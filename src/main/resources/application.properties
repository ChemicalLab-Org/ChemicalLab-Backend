spring.application.name=chemical-lab-backend

# Puerto: Render inyecta la variable PORT. En local cae al 8080.
server.port=${PORT:8080}

# Conexion a PostgreSQL. En despliegue, Render provee estos valores por variable de entorno.
# En local cae a la base de datos de desarrollo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/lab_quimico_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Estrategia de esquema.
# Valor por defecto = update (seguro para despliegue: NO borra datos existentes).
# Para recrear el esquema en desarrollo local, exportar SPRING_JPA_HIBERNATE_DDL_AUTO=create
# (o cambiarlo manualmente solo de forma temporal). Nunca usar create por defecto en despliegue.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.time-zone=America/Lima

# JWT — configuración para generación y validación de tokens
# IMPORTANTE: app.jwt.secret DEBE estar codificado en Base64 estándar (alfabeto A-Z, a-z, 0-9, +, /, =).
# No usar guiones bajos ni guiones medios sin codificar — fallan al decodificar.
# La clave decodificada debe tener al menos 32 bytes (256 bits) para HS256.
# Para generar una clave nueva:
#   PowerShell: [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("tu-frase-larga"))
#   OpenSSL:    openssl rand -base64 64
# El valor por defecto es SOLO para desarrollo. En despliegue, inyectar APP_JWT_SECRET por variable de entorno.
app.jwt.secret=${APP_JWT_SECRET:Y2hlbWljYWxsYWItYmFja2VuZC1qd3QtZGV2LW9ubHktc2VjcmV0LXJvdGF0ZS1pbi1wcm9kdWN0aW9uLTIwMjYtbWluLTMyLWJ5dGVz}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS — lista de orígenes permitidos separados por comas.
# En despliegue, definir APP_CORS_ALLOWED_ORIGINS con la URL del frontend (ej: https://chemicallab.vercel.app).
# En local cae a los orígenes del servidor de desarrollo de Angular.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
