spring.application.name=chemical-lab-backend

# Puerto: Render inyecta la variable PORT. En local cae al 8080.
server.port=${PORT:8080}

# Sin perfil explícito se aplica producción; nunca desarrollo implícito.
spring.profiles.default=prod

# Conserva la estrategia actual. Las migraciones versionadas corresponden a otra tarea.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.time-zone=America/Lima

# Carga de archivos (materiales de apoyo de contenidos conceptuales).
# Limite estricto de 10 MB por archivo; el limite de la peticion deja un margen para
# las cabeceras multipart. El servicio valida ademas el tamano y el tipo del archivo.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# JWT externo obligatorio salvo fallback público exclusivo de dev/test.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# CORS — lista de orígenes permitidos separados por comas.
# En despliegue, definir APP_CORS_ALLOWED_ORIGINS con la URL del frontend (ej: https://chemicallab.vercel.app).
# En local cae a los orígenes del servidor de desarrollo de Angular.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# Opciones independientes, deshabilitadas por defecto.
app.demo.enabled=${APP_DEMO_ENABLED:false}
app.bootstrap.admin.enabled=${APP_BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.username=${APP_BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.email=${APP_BOOTSTRAP_ADMIN_EMAIL:}
